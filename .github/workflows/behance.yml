name: Atualizar projetos do Behance

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, por volta das 6h17 em Recife
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  behance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar projetos
        run: python scripts/behance.py
      - name: Salvar no site
        run: |
          git add behance.json img/behance
          if git diff --cached --quiet; then
            echo "Nenhum projeto novo."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza projetos do Behance"
            git push
          fi
